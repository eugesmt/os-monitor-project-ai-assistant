[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "taskmanager-developer-assistant"
version = "0.1.0"
description = "Standalone RAG developer assistant for the Task Manager AI project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
    "faiss-cpu>=1.8,<2",
]

[project.scripts]
taskmanager-assistant = "dev_assistant.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["dev_assistant"]
